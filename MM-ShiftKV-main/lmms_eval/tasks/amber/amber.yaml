dataset_path: json
dataset_kwargs:
  data_files:
    test: /root/autodl-tmp/Method/dataset/AMBER/query_all.json
task: amber
test_split: test
output_type: generate_until
doc_to_visual: !function utils.amber_doc_to_visual
doc_to_text: !function utils.amber_doc_to_text
doc_to_target: "query"
generation_kwargs:
  max_new_tokens: 512
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
process_results: !function utils.amber_process_results
metric_list:
  - metric: amber_responses
    aggregation: !function utils.amber_aggregate_responses
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: ""
metadata:
  version: 0.0
